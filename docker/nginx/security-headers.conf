# ============================================================================
# Security Headers — Intermedius
# Incluir en server block de producción:
#   include /etc/nginx/conf.d/security-headers.conf;
# ============================================================================

# Evita clickjacking
add_header X-Frame-Options "SAMEORIGIN" always;

# Previene MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Habilita filtro XSS del navegador
add_header X-XSS-Protection "1; mode=block" always;

# Control de referrer
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Restringe APIs del navegador
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Fuerza HTTPS por 1 año (solo en producción con SSL)
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Content Security Policy
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.intermediusg.com; frame-ancestors 'none'; form-action 'self'; base-uri 'self';" always;
