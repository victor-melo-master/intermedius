services:
  db:
    image: mariadb:10.3
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: intermedius_casa_cambio
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: secret
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
    networks:
      - intermedius

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 10
    networks:
      - intermedius

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - intermedius

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - intermedius

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    ports:
    - "8000:8000"                          # ← agregar
    command: php artisan serve --host=0.0.0.0 --port=8000
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "${APP_KEY:-base64:}"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: intermedius_casa_cambio
      DB_USERNAME: laravel_user
      DB_PASSWORD: secret
      DB_COLLATION: utf8mb4_general_ci
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_ENCRYPTION: ""
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: intermedius
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      FILESYSTEM_DISK: s3
      PHP_IDE_CONFIG: "serverName=intermedius"
      RUN_MIGRATIONS: "true"
    volumes:
      - ./api:/var/www
      - api_vendor:/var/www/vendor
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - intermedius

  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "8000:80"
  #   volumes:
  #     - ./api:/var/www
  #     - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
  #   depends_on:
  #     - api
  #   networks:
  #     - intermedius

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    # depends_on:
    #   - nginx
    networks:
      - intermedius

  horizon:
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    command: php artisan horizon
    volumes:
      - ./api:/var/www
      - api_vendor:/var/www/vendor
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "${APP_KEY:-base64:}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: intermedius_casa_cambio
      DB_USERNAME: laravel_user
      DB_PASSWORD: secret
      DB_COLLATION: utf8mb4_general_ci
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: intermedius
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - intermedius

  schedule:
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    command: php artisan schedule:work
    volumes:
      - ./api:/var/www
      - api_vendor:/var/www/vendor
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "${APP_KEY:-base64:}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: intermedius_casa_cambio
      DB_USERNAME: laravel_user
      DB_PASSWORD: secret
      DB_COLLATION: utf8mb4_general_ci
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: intermedius
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - intermedius

volumes:
  db_data:
  minio_data:
  api_vendor:

networks:
  intermedius:
    driver: bridge
